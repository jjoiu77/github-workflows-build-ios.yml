name: 编译Wenku8_Flutter iOS IPA（全能签专用·ATS放行）

on:
  workflow_dispatch: # 手动点运行
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: 国内镜像加速
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> $GITHUB_ENV

      - name: 安装依赖
        run: flutter pub get

      - name: 【关键】修改Info.plist，放行HTTP（解决空白）
        run: |
          plutil -insert NSAppTransportSecurity -d dict ios/Runner/Info.plist
          plutil -insert NSAppTransportSecurity.NSAllowsArbitraryLoads -bool true ios/Runner/Info.plist

      - name: 安装CocoaPods依赖
        run: |
          cd ios
          pod install --repo-update

      - name: 编译IPA（不签名，全能签自己签）
        run: flutter build ipa --release --no-codesign

      - name: 上传IPA成品
        uses: actions/upload-artifact@v4
        with:
          name: Wenku8-iPA-全能签版
          path: build/ios/ipa/*.ipa
